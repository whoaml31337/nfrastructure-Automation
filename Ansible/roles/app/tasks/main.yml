---
- name: Install python and pip
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: yes

- name: Create app directory
  ansible.builtin.file:
    path: /home/vagrant/app
    state: directory
    mode: 0755

- name: Sync app files including requirements.txt
  ansible.builtin.synchronize:
    src: ../app/   
    dest: /home/vagrant/app/
    delete: yes
    recursive: yes
    mode: push


- name: Fix permissions for app files
  ansible.builtin.file:
    path: /home/vagrant/app/requirements.txt
    mode: '0644'

- name: Install dependencies
  ansible.builtin.pip:
    requirements: /home/vagrant/app/requirements.txt
    executable: pip3
    state: present

- name: Deploy systemd unit
  ansible.builtin.template:
    src: app.service.j2
    dest: /etc/systemd/system/flask-app.service
    mode: 0644
    validate: /usr/bin/systemd-analyze verify %s
  notify: reload systemd

- name: Ensure app is running
  ansible.builtin.systemd:
    name: flask-app
    state: started
    enabled: yes
