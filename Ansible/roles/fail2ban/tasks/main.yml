- name: Install Fail2Ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: yes
  
- name: Ensure config directory exists
  ansible.builtin.file:
    path: /etc/fail2ban
    state: directory
    mode: 0755

- name: Deploy Fail2Ban config
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban
    

  
    